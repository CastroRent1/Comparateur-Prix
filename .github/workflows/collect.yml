name: Collecte des prix

# MANUEL UNIQUEMENT tant que l'avocat n'a pas donné son feu vert (étape 0).
# Après feu vert : décommenter « schedule » (relevé de nuit, heure creuse).
on:
  workflow_dispatch:
    inputs:
      chain:
        description: "Enseigne (id de config/chains.json)"
        required: true
        default: aldi
      mode:
        description: "explore = calibrer (aucune donnée écrite) ; collect = relever les prix"
        required: true
        default: explore
        type: choice
        options: [explore, collect]
      max_pages:
        description: "Nombre maximal de pages produit"
        required: true
        default: "200"
  # schedule:
  #   - cron: "17 2 * * *" # ~3 h 17 à Bruxelles

permissions:
  contents: write

concurrency:
  group: collect-${{ inputs.chain || 'aldi' }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BOT_CONTACT_URL: ${{ vars.BOT_CONTACT_URL || 'https://paniermalin.be/robot' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Explorer (robots.txt + sitemaps)
        if: inputs.mode == 'explore'
        run: npm run collect -- "${{ inputs.chain }}" --explore

      - name: Collecter
        if: inputs.mode == 'collect'
        id: collect
        # Code 2 = arrêt pour blocage : données partielles fusionnées, on commite quand même.
        run: |
          set +e
          npm run collect -- "${{ inputs.chain }}" --max-pages "${{ inputs.max_pages }}"
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "1" ]; then exit 1; fi
          exit 0

      - name: Commiter les prix
        if: inputs.mode == 'collect'
        run: |
          git config user.name "panier-malin-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest
          if git diff --cached --quiet; then echo "Aucun changement."; exit 0; fi
          git commit -m "Prix ${{ inputs.chain }} $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - name: Signaler un blocage
        if: steps.collect.outputs.code == '2'
        run: |
          echo "::warning::La collecte ${{ inputs.chain }} a été arrêtée pour blocage. Ne pas relancer en boucle : vérifier robots.txt et consulter docs/dossier-avocat.md."
