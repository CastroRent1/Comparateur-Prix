name: Collecte des prix

# Chaque nuit : Aldi (tout l'assortiment) et une tranche sur deux de Delhaize,
# en parallèle (deux sites différents, une requête à la fois par site, ≥ 2 s),
# puis reconstruction du catalogue de l'appli.
# Pour suspendre : commenter le bloc « schedule » (ou désactiver le workflow
# dans l'onglet Actions).
on:
  schedule:
    - cron: "7 1 * * *" # ~2 h 07 à Bruxelles
  workflow_dispatch:
    inputs:
      chains:
        description: "Enseignes à relever (séparées par des virgules)"
        default: "aldi,delhaize"
      max_pages:
        description: "Pages maximum par enseigne"
        default: "5000"

permissions:
  contents: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collect:
    strategy:
      fail-fast: false
      matrix:
        chain: [aldi, delhaize]
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      BOT_CONTACT_URL: ${{ vars.BOT_CONTACT_URL || 'https://paniermalin.be/robot' }}
    steps:
      - uses: actions/checkout@v4
        if: contains(inputs.chains || 'aldi,delhaize', matrix.chain)
      - uses: actions/setup-node@v4
        if: contains(inputs.chains || 'aldi,delhaize', matrix.chain)
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: contains(inputs.chains || 'aldi,delhaize', matrix.chain)
      - name: Relever ${{ matrix.chain }}
        if: contains(inputs.chains || 'aldi,delhaize', matrix.chain)
        # Code 2 = arrêt pour blocage : données partielles gardées, aucun contournement.
        run: |
          SHARD=""
          if [ "${{ matrix.chain }}" = "delhaize" ]; then SHARD="--shard $(( 10#$(date -u +%j) % 2 ))/2"; fi
          set +e
          timeout 325m npm run collect -- "${{ matrix.chain }}" --max-pages "${{ inputs.max_pages || '5000' }}" $SHARD
          code=$?
          if [ "$code" = "2" ]; then echo "::warning::${{ matrix.chain }} : collecte arrêtée pour blocage. Ne pas relancer en boucle."; fi
          if [ "$code" = "124" ]; then echo "::warning::${{ matrix.chain }} : limite de temps atteinte, données partielles gardées."; fi
          if [ "$code" = "1" ]; then exit 1; fi
          exit 0
      - uses: actions/upload-artifact@v4
        if: contains(inputs.chains || 'aldi,delhaize', matrix.chain)
        with:
          name: prix-${{ matrix.chain }}
          path: data/latest/${{ matrix.chain }}.json
          if-no-files-found: ignore
          retention-days: 3

  publish:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: prix-*
          path: data/latest
          merge-multiple: true
      - name: Reconstruire le catalogue et l'appli
        run: npm run build
      - name: Commiter
        run: |
          git config user.name "panier-malin-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest web/app/data/catalog.json web/app/app.js
          if git diff --cached --quiet; then echo "Aucun changement."; exit 0; fi
          git commit -m "Prix du $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin main
          git push
