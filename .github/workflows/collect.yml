name: Collecte des prix

# Trois passages par jour, jamais en même temps (groupe « collecte ») :
#   ~1 h 37 (Bruxelles) : Aldi (tout l'assortiment, ~1 h 40) + Delhaize tiers 0
#   ~9 h 37             : Delhaize tiers 1
#   ~17 h 37            : Delhaize tiers 2
# Delhaize répond en ~4,4 s par page : un tiers (~3 200 pages) tient en ~4 h,
# et chaque produit est relevé une fois par 24 h. Une requête à la fois par
# site, ≥ 2 s d'écart. Puis reconstruction du catalogue de l'appli.
# Pour suspendre : commenter le bloc « schedule » (ou désactiver le workflow
# dans l'onglet Actions).
on:
  schedule:
    - cron: "37 0 * * *"
    - cron: "37 8 * * *"
    - cron: "37 16 * * *"
  workflow_dispatch:
    inputs:
      chains:
        description: "Enseignes à relever (séparées par des virgules)"
        default: "aldi,delhaize"
      delhaize_shard:
        description: "Tiers Delhaize (0, 1, 2 ou auto = selon l'heure)"
        default: "auto"
      max_pages:
        description: "Pages maximum par enseigne"
        default: "5000"

permissions:
  contents: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collect:
    strategy:
      fail-fast: false
      matrix:
        chain: [aldi, delhaize]
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      BOT_CONTACT_URL: ${{ vars.BOT_CONTACT_URL || 'https://paniermalin.be/robot' }}
    steps:
      - uses: actions/checkout@v4
        if: contains(inputs.chains || (github.event.schedule == '37 0 * * *' && 'aldi,delhaize' || 'delhaize'), matrix.chain)
      - uses: actions/setup-node@v4
        if: contains(inputs.chains || (github.event.schedule == '37 0 * * *' && 'aldi,delhaize' || 'delhaize'), matrix.chain)
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: contains(inputs.chains || (github.event.schedule == '37 0 * * *' && 'aldi,delhaize' || 'delhaize'), matrix.chain)
      - name: Relever ${{ matrix.chain }}
        if: contains(inputs.chains || (github.event.schedule == '37 0 * * *' && 'aldi,delhaize' || 'delhaize'), matrix.chain)
        # Code 2 = arrêt pour blocage : données partielles gardées, aucun contournement.
        run: |
          SHARD=""
          if [ "${{ matrix.chain }}" = "delhaize" ]; then
            T="${{ inputs.delhaize_shard || 'auto' }}"
            case "${{ github.event.schedule }}" in
              "37 0 * * *") T=0 ;; "37 8 * * *") T=1 ;; "37 16 * * *") T=2 ;;
            esac
            if [ "$T" = "auto" ]; then H=$(( 10#$(date -u +%H) )); T=$(( H < 8 ? 0 : H < 16 ? 1 : 2 )); fi
            SHARD="--shard $T/3"
            echo "Delhaize : tiers $T/3"
          fi
          set +e
          timeout 330m npm run collect -- "${{ matrix.chain }}" --max-pages "${{ inputs.max_pages || '5000' }}" $SHARD
          code=$?
          if [ "$code" = "2" ]; then echo "::warning::${{ matrix.chain }} : collecte arrêtée pour blocage. Ne pas relancer en boucle."; fi
          if [ "$code" = "124" ]; then echo "::warning::${{ matrix.chain }} : limite de temps atteinte, données partielles gardées."; fi
          if [ "$code" = "1" ]; then exit 1; fi
          exit 0
      - uses: actions/upload-artifact@v4
        if: contains(inputs.chains || (github.event.schedule == '37 0 * * *' && 'aldi,delhaize' || 'delhaize'), matrix.chain)
        with:
          name: prix-${{ matrix.chain }}
          path: data/latest/${{ matrix.chain }}.json
          if-no-files-found: ignore
          retention-days: 3

  publish:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: prix-*
          path: data/latest
          merge-multiple: true
      - name: Reconstruire le catalogue et l'appli
        run: npm run build
      - name: Commiter
        run: |
          git config user.name "panier-malin-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest data/controle-qualite.json web/app/data/catalog.json web/app/app.js
          if git diff --cached --quiet; then echo "Aucun changement."; exit 0; fi
          git commit -m "Prix du $(date -u +%Y-%m-%d)"
          # En cas de commit concurrent : on garde nos prix, et on reconstruit le catalogue.
          for i in 1 2 3; do git push && exit 0; git pull --rebase -X theirs origin main || exit 1; npm run build; git add data/controle-qualite.json web/app/data/catalog.json web/app/app.js; git commit --amend --no-edit; done
          exit 1
