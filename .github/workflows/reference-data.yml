name: Données de référence

# Magasins (OpenStreetMap, ODbL) et codes postaux (GeoNames, CC BY 4.0).
# Une fois par mois, et à la demande.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 3 * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Magasins (OpenStreetMap)
        run: npm run stores
      - name: Codes postaux (GeoNames)
        run: npm run postcodes
      - name: Repartir du dernier état du dépôt (prix collectés entre-temps)
        run: |
          git config user.name "panier-malin-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/ref && cp data/stores.json data/postcodes.json /tmp/ref/
          git checkout -- . && git clean -fdq data
          git pull --rebase origin main
          cp /tmp/ref/stores.json /tmp/ref/postcodes.json data/
      - name: Reconstruire le catalogue et l'appli
        run: npm run build
      - name: Commiter
        run: |
          git add data/stores.json data/postcodes.json web/app/data/catalog.json web/app/app.js
          if git diff --cached --quiet; then echo "Aucun changement."; exit 0; fi
          git commit -m "Données de référence $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git push && exit 0; git pull --rebase -X theirs origin main || exit 1; npm run build; git add web/app/data/catalog.json web/app/app.js; git commit --amend --no-edit; done
          exit 1
